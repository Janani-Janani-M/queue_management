# ============================================================
#  QueueCare – DEV Profile (H2 in-memory — no MySQL needed)
#  Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

server.port=8080

# H2 in-memory DataSource
spring.datasource.url=jdbc:h2:mem:queuecaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate – auto-create schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 console (visit http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.queuecare=INFO
logging.level.org.springframework.web=WARN
