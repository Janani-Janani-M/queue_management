# ============================================================
#  QueueCare – Spring Boot Application Configuration
#  Safe MySQL Database Connection + Connection Pooling
# ============================================================

server.port=8080
server.servlet.context-path=/

# ---------------------------------------------------------------
# MySQL DataSource (XAMPP / MySQL on port 3306)
# Configured with safe timeouts, SSL flags, and reconnection
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:queuecare_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------
# HikariCP Connection Pool (prevents connection leaks)
# ---------------------------------------------------------------
spring.datasource.hikari.pool-name=QueueCareHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ---------------------------------------------------------------
# JPA / Hibernate Configuration
# ddl-auto=update ensures existing citizens & sessions are preserved
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
logging.level.com.queuecare=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
